name: Validate listings

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate-listings.mjs"
      - ".github/workflows/validate-listings.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate-listings.mjs"
      - ".github/workflows/validate-listings.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-listings.mjs --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
